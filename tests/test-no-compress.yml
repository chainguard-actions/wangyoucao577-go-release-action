name: Test build without compression
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: linux
          goarch: arm64
          project_path: tests/fixtures/goapp
          binary_name: testapp-arm64
          upload: 'FALSE'
          md5sum: 'FALSE'
          sha256sum: 'TRUE'
          compress_assets: 'OFF'

      - name: Assert release_asset_dir output is set
        env:
          ASSET_DIR: ${{ steps.action.outputs.release_asset_dir }}
        run: |
          echo "release_asset_dir: $ASSET_DIR"
          if [ -z "$ASSET_DIR" ]; then
            echo "FAIL: release_asset_dir output is empty"
            exit 1
          fi
          echo "PASS: release_asset_dir is set to '$ASSET_DIR'"

      - name: Assert build artifact directory exists
        env:
          ASSET_DIR: ${{ steps.action.outputs.release_asset_dir }}
        run: |
          echo "Checking directory: $ASSET_DIR"
          if [ ! -d "$ASSET_DIR" ]; then
            echo "FAIL: release_asset_dir '$ASSET_DIR' does not exist"
            exit 1
          fi
          echo "Contents of asset dir:"
          ls -lha "$ASSET_DIR"
          echo "PASS: release_asset_dir exists"

      - name: Assert binary was built (no archive)
        env:
          ASSET_DIR: ${{ steps.action.outputs.release_asset_dir }}
        run: |
          echo "Looking for testapp-arm64 binary in $ASSET_DIR"
          if [ ! -f "$ASSET_DIR/testapp-arm64" ]; then
            echo "FAIL: expected binary 'testapp-arm64' not found in $ASSET_DIR"
            ls -lha "$ASSET_DIR" || true
            exit 1
          fi
          echo "PASS: binary 'testapp-arm64' found"

      - name: Assert no tar.gz archive was created (compress_assets=OFF)
        env:
          ASSET_DIR: ${{ steps.action.outputs.release_asset_dir }}
        run: |
          PARENT_DIR=$(dirname "$ASSET_DIR")
          echo "Checking that no .tar.gz archive exists in $PARENT_DIR"
          ARCHIVES=$(find "$PARENT_DIR" -maxdepth 1 -name "*.tar.gz" 2>/dev/null)
          if [ -n "$ARCHIVES" ]; then
            echo "FAIL: unexpected .tar.gz archive found when compress_assets=OFF: $ARCHIVES"
            exit 1
          fi
          echo "PASS: no tar.gz archive (compress_assets=OFF as expected)"
