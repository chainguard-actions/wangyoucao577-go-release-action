name: Test basic build linux/amd64
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          goos: linux
          goarch: amd64
          project_path: tests/fixtures/go-project
          binary_name: hello
          upload: 'FALSE'
          compress_assets: 'AUTO'
          md5sum: 'TRUE'
          sha256sum: 'FALSE'

      - name: Assert release_asset_dir output is set
        env:
          ACTUAL: ${{ steps.action.outputs.release_asset_dir }}
        run: |
          echo "release_asset_dir: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: release_asset_dir output is empty"
            exit 1
          fi
          echo "PASS: release_asset_dir=$ACTUAL"

      - name: Assert build artifact directory exists
        env:
          ASSET_DIR: ${{ steps.action.outputs.release_asset_dir }}
        run: |
          # release_asset_dir may be relative (from inside the container) or absolute
          if [[ "$ASSET_DIR" = /* ]]; then
            FULL_ASSET_DIR="$ASSET_DIR"
          else
            FULL_ASSET_DIR="$GITHUB_WORKSPACE/$ASSET_DIR"
          fi
          echo "Checking asset dir: $FULL_ASSET_DIR"
          if [ ! -d "$FULL_ASSET_DIR" ]; then
            echo "FAIL: release_asset_dir '$FULL_ASSET_DIR' does not exist"
            echo "Contents of GITHUB_WORKSPACE:"
            ls -lha "$GITHUB_WORKSPACE"
            exit 1
          fi
          echo "Contents of asset dir:"
          ls -lha "$FULL_ASSET_DIR"
          echo "PASS: asset directory exists"

      - name: Assert compressed artifact exists
        env:
          ASSET_DIR: ${{ steps.action.outputs.release_asset_dir }}
        run: |
          # release_asset_dir may be relative (from inside the container) or absolute
          if [[ "$ASSET_DIR" = /* ]]; then
            FULL_ASSET_DIR="$ASSET_DIR"
          else
            FULL_ASSET_DIR="$GITHUB_WORKSPACE/$ASSET_DIR"
          fi
          PARENT_DIR=$(dirname "$FULL_ASSET_DIR")
          echo "Contents of parent dir:"
          ls -lha "$PARENT_DIR"
          # The artifact should be a .tar.gz for linux/amd64 with AUTO compression
          TARBALL=$(find "$PARENT_DIR" -maxdepth 1 -name "*.tar.gz" | head -1)
          if [ -z "$TARBALL" ]; then
            echo "FAIL: no .tar.gz artifact found in $PARENT_DIR"
            exit 1
          fi
          echo "PASS: found artifact $TARBALL"
