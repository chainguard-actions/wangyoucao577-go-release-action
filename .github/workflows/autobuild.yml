name: Build Docker 

on: 
  push:
    branches-ignore:
    - '*-prebuilt'

permissions: {}

jobs:

  build:
    name: Build & Publish Docker

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Set DOCKER_REPO_NAME env 
      run: |
        safe=$(basename "${GITHUB_REPOSITORY}" | tr -d '\n\r')
        echo "DOCKER_REPO_NAME=${safe}" >> "${GITHUB_ENV}"
    - name: Set IMAGE_TAG env 
      run: |
        safe=$(basename "${GITHUB_REF}" | tr -d '\n\r')
        echo "IMAGE_TAG=${safe}" >> "${GITHUB_ENV}"
    - name: Environment Printer
      uses: managedkaos/print-env@cc44fee1591e49c86931a4a7458926ec441a85dd # v1.0
    - name: Append latest if master branches # env '${IMAGE_TAG},latest'
      if: endsWith(github.ref, 'master')
      run: |
        safe=$(printf '%s' "${IMAGE_TAG},master,latest" | tr -d '\n\r')
        echo "IMAGE_TAG=${safe}" >> "${GITHUB_ENV}"
    - name: Environment Printer
      uses: managedkaos/print-env@cc44fee1591e49c86931a4a7458926ec441a85dd # v1.0

    # Add support for more platforms with QEMU (optional)
    # https://github.com/docker/setup-qemu-action
    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Build & Publish to Github Container Registry
      uses: elgohr/Publish-Docker-Github-Action@1c2f28ccd9476e8a936ac9a1f287405504c93304 # v5
      with:
        name: ${{ github.actor }}/${{ env.DOCKER_REPO_NAME }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        platforms: linux/amd64,linux/arm64
        registry: ghcr.io
        snapshot: false
        tags: "${{ env.IMAGE_TAG }}"

    - name: Build & Publish to DockerHub
      uses: elgohr/Publish-Docker-Github-Action@1c2f28ccd9476e8a936ac9a1f287405504c93304 # v5
      with:
        name: ${{ github.repository }}
        username: ${{ github.actor }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        platforms: linux/amd64,linux/arm64
        snapshot: false
        tags: "${{ env.IMAGE_TAG }}"
